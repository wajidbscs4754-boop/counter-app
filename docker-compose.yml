services:
  app:
    image: asdf417/counter-app:1.0
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - cache

  cache:
    image: redis:7
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data

volumes:
  redisdata: