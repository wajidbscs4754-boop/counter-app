apiVersion: apps/v1
kind: Deployment
metadata:
  name: counter-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: counter-app
  template:
    metadata:
      labels:
        app: counter-app
    spec:
      containers:
        - name: counter-app
          image: asdf417/counter-app:latest
          ports:
            - containerPort: 5000
          env:
            - name: APP_NAME
              value: "Meri K8s App"
            - name: REDIS_HOST
              value: "cache"
